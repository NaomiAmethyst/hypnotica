name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci
      - run: npm test
      - run: CGO_ENABLED=0 go build -trimpath -o bin/hypnotica ./cmd/hypnotica

  binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          package="hypnotica-${GOOS}-${GOARCH}"
          mkdir -p "dist/$package"
          executable=hypnotica
          if [ "$GOOS" = windows ]; then executable=hypnotica.exe; fi
          go build -trimpath -ldflags="-s -w" -o "dist/$package/$executable" ./cmd/hypnotica
          cp LICENSE THIRD_PARTY.md README.md "dist/$package/"
          cp -R LICENSES "dist/$package/"
          printf 'Source: %s/%s/tree/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" > "dist/$package/SOURCE.txt"
          cd dist
          if [ "$GOOS" = windows ]; then
            zip -r "$package.zip" "$package"
            sha256sum "$package.zip" > "$package.zip.sha256"
          else
            tar -czf "$package.tar.gz" "$package"
            sha256sum "$package.tar.gz" > "$package.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hypnotica-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          compression-level: 0

  release:
    needs: binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hypnotica-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
          fi

  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
          labels: |
            org.opencontainers.image.licenses=GPL-3.0-only
      - name: Log in to GitHub Container Registry
        if: >-
          github.event_name == 'push' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
          startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build multiarchitecture container
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: >-
            ${{ github.event_name == 'push' &&
            (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
            startsWith(github.ref, 'refs/tags/v')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
