<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<meta name="description" content="__DESCRIPTION__">
<meta name="theme-color" content="__THEME__">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Not black-translucent: that runs the page under the status bar, and the
     clock is drawn in white over whatever is there. On a light theme that is a
     white clock on a near-white header, and on any theme it lands on top of the
     bar. "default" has the system keep the strip and start the page below it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="__TITLE__">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=__BUILD_ID__">
<link rel="stylesheet" href="namespaces.css?v=__BUILD_ID__">
<link rel="icon" href="__ICON__">
<link rel="apple-touch-icon" href="__ICON__">
<link rel="alternate" type="application/rss+xml" title="__TITLE__" href="feed/all.xml">
</head>
<body>
<header class="top">
  <div class="topbar">
    <a class="brand" href="#/"><span class="dot"></span><span id="brandName">__TITLE__</span></a>
    <div class="bars" id="navMenu">
      <button class="barsbtn" id="navToggle" type="button" aria-label="Menu" title="Menu"
        aria-expanded="false" aria-controls="navLinks"><span class="burger"></span></button>
      <nav class="navlinks" id="navLinks">
        <a href="#/">Library</a>
        <a href="#/authors">Authors</a>
        <a href="#/queue">Queue</a>
        <a id="feedAll" href="feed/all.xml">RSS</a>
      </nav>
    </div>
    <details class="me" id="meMenu">
      <summary aria-label="You"><span class="medot"></span><span id="meName">You</span></summary>
      <div class="mebody" id="meBody"></div>
    </details>
  </div>
</header>

<main id="main" class="wrap"><p class="count">Loading library…</p></main>

<div class="player hidden" id="player">
  <div class="inner">
    <img class="art hidden" id="pArt" alt="" id="pOpen">
    <div class="who" id="pOpen" role="button" tabindex="0">
      <b id="pTitle"></b><span id="pSub"></span>
    </div>
    <div class="ctl">
      <button id="pPrev" title="Previous (Shift+←)">⏮</button>
      <button id="pBack" title="Back 15s">−15</button>
      <button id="pPlay" class="big" title="Play/pause (Space)">▶</button>
      <button id="pFwd" title="Forward 30s">+30</button>
      <button id="pNext" title="Next (Shift+→)">⏭</button>
      <button id="pRate" class="rate" title="Playback speed">1×</button>
    </div>
  </div>
  <div class="bar">
    <time id="pNow">0:00</time>
    <input id="pSeek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <time id="pEnd">0:00</time>
  </div>
</div>

<dialog id="plDlg">
  <div class="dh">Add to playlist</div>
  <div class="db" id="plDlgBody"></div>
  <div class="df"><button class="btn" onclick="this.closest('dialog').close()">Close</button></div>
</dialog>

<dialog id="ioDlg">
  <div class="dh" id="ioTitle">Import</div>
  <div class="db" id="ioBody"></div>
  <div class="df" id="ioFoot"></div>
</dialog>

<script src="app.js?v=__BUILD_ID__"></script>
</body>
</html>
