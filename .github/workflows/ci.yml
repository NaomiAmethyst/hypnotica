name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm ci
      - run: npm test
      - run: CGO_ENABLED=0 go build -trimpath -o bin/hypnotica ./cmd/hypnotica
